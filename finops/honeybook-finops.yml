meters:
- name: subscription_fee
  description: Flat monthly or annual membership fee for the Starter, Essentials, or Premium plan.
  unit: month
  aggregation: sum
  dimensions:
  - account
  - plan
- name: card_payment_volume
  description: Client card payments processed through HoneyBook, billed starting at 2.7% + 10 cents per transaction.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - project
- name: ach_payment_volume
  description: Client ACH bank-transfer payments processed through HoneyBook, billed at 1.5% per transaction.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - project
- name: seat_count
  description: Team members added beyond what a plan tier includes by default (Essentials caps at 2; Premium is unlimited).
  unit: seats
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track plan tier, seat count, and monthly payment-processing volume (card vs ACH mix) per account.
- name: Allocation
  description: For agencies or multi-brand operators on Premium, allocate subscription and processing costs per managed company/brand.
- name: Optimization
  description: Favor ACH over card where clients will accept it (1.5% vs 2.7%+10 cents); move to Premium's volume-discount threshold ($500K/year processed) only once payment volume justifies it; downgrade plan tier if automations/Scheduler/branding removal go unused.
- name: Accountability
  description: Assign a plan-tier and integrations owner per account; review monthly payment-processing statements against the published fee schedule.
