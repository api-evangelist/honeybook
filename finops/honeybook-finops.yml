description: >-
  FinOps view of HoneyBook spend for a service-based small business. Cost has
  two components - a flat monthly/annual subscription per company (Starter,
  Essentials, or Premium) and a variable per-transaction payment-processing
  fee (card or ACH) charged whenever a client pays an invoice through
  HoneyBook. There is no API-related cost line because HoneyBook has no
  public developer API or metered API product; all integration today is
  either a native connector (QuickBooks Online, Zoom, Calendly, Flodesk,
  Canva, Meta Leads, Slack, Asana, monday.com) included in a plan tier, or
  routed through a separate Zapier subscription that the customer pays for
  independently.
notes: >-
  Because HoneyBook has no public API, there are no per-call or per-token
  usage meters to track the way there would be for an AI or infrastructure
  API. The dominant cost lever for a HoneyBook customer is plan tier
  selection plus payment-processing volume, not API consumption.
