components:
  schemas:
    createProject:
      type: object
      properties:
        include:
          type: array
          description: 'Comma-separated relations to populate. Allowed: workspaces, custom_fields, cover_image. A relation not requested is null. Nested paths (a.b) are not supported.'
          items:
            type: string
            enum:
            - workspaces
            - custom_fields
            - cover_image
        max_workspaces:
          type: integer
          format: int32
          description: Max workspaces per row (1..25, default 25). Ordered by created_at asc. Requires include=workspaces.
          minimum: 1
          maximum: 25
        max_custom_fields:
          type: integer
          format: int32
          description: Max custom_fields per row (1..50, default 50). Ordered by order asc. Requires include=custom_fields.
          minimum: 1
          maximum: 50
        name:
          type: string
          description: Project display name (auto-generated if omitted)
        project_date:
          type: string
          format: date
          description: Primary start calendar date
        project_end_date:
          type: string
          format: date
          description: Primary end calendar date
        project_time_start:
          type: string
          description: Start time of day (e.g. "10:00 AM")
        project_time_end:
          type: string
          description: End time of day
        project_timezone:
          type: string
          description: IANA timezone
        project_location:
          type: string
          description: Primary location/venue
        project_details:
          type: string
          description: Free-text project details
        guest_count:
          type: integer
          format: int32
          description: Expected number of guests
        budget:
          type: integer
          format: int32
          description: Expected budget, a bare number in the company's currency
        availability_type:
          type: string
          description: Availability kind (lowercase snake_case enum)
          enum:
          - busy
          - free
        project_type_id:
          type: string
          description: Company ProjectType id to classify the project
        lead_source_id:
          type: string
          description: Id of one of the company's lead sources to attribute the project to
        lead_source_open_text:
          type: string
          description: Free text for an "other" lead source
      description: Create a project
    Api_V3_Entities_CustomFieldValue:
      oneOf:
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_Date'
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_Link'
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_LongText'
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_MultiSelect'
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_Number'
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_SingleSelect'
      - $ref: '#/components/schemas/Api_V3_Entities_CustomFieldValue_Text'
    Api_V3_Entities_ProjectCoverImage:
      type: object
      properties:
        id:
          type: string
          format: objectid
          description: Image id
        url:
          type:
          - string
          - 'null'
          description: Served image URL (a Cloudinary secure URL when the image was uploaded through Cloudinary)
        original_url:
          type:
          - string
          - 'null'
          description: URL of the original the image was taken from
        cloudinary_public_id:
          type:
          - string
          - 'null'
          description: Cloudinary public id, so a client may derive its own transformations; null for non-Cloudinary images
        width:
          type:
          - integer
          - 'null'
          format: int32
          description: Source width in pixels
        height:
          type:
          - integer
          - 'null'
          format: int32
          description: Source height in pixels
        position_x:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Crop rectangle: left offset in pixels'
        position_y:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Crop rectangle: top offset in pixels'
        position_w:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Crop rectangle: width in pixels'
        position_h:
          type:
          - integer
