openapi: 3.2.0
info:
  title: HoneyBook Projects API
  description: 'The HoneyBook API lets you read and write the data behind a HoneyBook account — contacts, projects, workspaces, smart files, tasks, notes, conversations and more.


    It is a JSON HTTP API. Every request is authenticated with an OAuth 2.0 access token, every response is JSON, and every endpoint lives under a single versioned base path.


    ### Base URL


    ```

    https://api.honeybook.com/api/v3

    ```


    The version is part of the path. A new major version gets its own path and its own documentation; endpoints in `v3` are not removed or changed in place.


    ### Making a request


    Send the access token as a bearer token:


    ```bash

    curl https://api.honeybook.com/api/v3/contacts \

    -H "Authorization: Bearer "

    ```


    ### How this documentation is organized


    **Guides** describe the conventions that apply across the whole API. Read Errors, Pagination and Filtering & Sorting once and they apply to every endpoint you touch.


    **API Reference** documents every endpoint, grouped by the resource it belongs to.


    ### Conventions worth knowing before you start


    - **Identifiers are opaque strings.** An id is a 24-character hexadecimal string. Treat it as an opaque token: do not parse it, and do not assume any structure or ordering.

    - **Timestamps are ISO 8601** in UTC, for example `2026-08-11T14:30:52Z`. Date-only fields are `YYYY-MM-DD`.

    - **Money is an object**, not a bare number — an amount together with its currency. Never assume a currency.

    - **Unknown query parameters are ignored, not rejected.** A misspelled filter name does not produce an error; it simply does not filter. Check your parameter names against the reference when a list returns more rows than you expected.

    - **Absent is not the same as empty.** A field that was not requested and a field that is genuinely empty are distinguished — see Relation Includes.


    The API is private. To get access, fill in the Request Access form.'
  version: v3
servers:
- url: https://api.honeybook.com/api/v3
  description: Production
security:
- oauth2: []
tags:
- name: Projects
  description: Operations about Projects
paths:
  /projects:
    get:
      description: List the caller company's projects
      parameters:
      - in: query
        name: page
        description: 1-indexed page number
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          default: 1
      - in: query
        name: per_page
        description: Page size (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: include
        description: 'Comma-separated relations to populate. Allowed: workspaces, custom_fields, cover_image. A relation not requested is null. Nested paths (a.b) are not supported.'
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - workspaces
            - custom_fields
            - cover_image
      - in: query
        name: max_workspaces
        description: Max workspaces per row (1..25, default 25). Ordered by created_at asc. Requires include=workspaces.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 25
      - in: query
        name: max_custom_fields
        description: Max custom_fields per row (1..50, default 50). Ordered by order asc. Requires include=custom_fields.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      - in: query
        name: name_contains
        description: event_name contains (case-insensitive)
        required: false
        schema:
          type: string
      - in: query
        name: project_type_id
        description: project_type =
        required: false
        schema:
          type: string
      - in: query
        name: project_after
        description: event_date >=
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: project_before
        description: event_date <=
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: created_after
        description: created_at >=
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        description: created_at <=
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        description: 'Comma-separated sort keys; ''-'' prefix = descending. Allowed: created_at, project_date, name. Default: -created_at.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List the caller company's projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Project_Page'
      tags:
      - Projects
      operationId: listProjects
      x-hb-resource: projects
      security:
      - oauth2:
        - projects.read
      - oauth2:
        - projects.read_own
      summary: List projects
      x-summary-source: derived
    post:
      summary: Create a project
      description: Creates the project and its first workspace. Ask for `?include=workspaces` to get that workspace back in this response — `workspaces.data[0].id` is the id needed to add a member to the new project (PUT /workspaces/:id/members/:user_id), so a caller does not have to discover it with a second call.
      parameters:
      - in: header
        name: Idempotency-Key
        description: 'Optional, 1-255 printable ASCII. Retrying with the same key, path and body within 24h returns the first response verbatim (`Idempotent-Replayed: true`) instead of creating another.'
        required: false
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createProject'
        required: true
      responses:
        '201':
          description: Create a project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Project'
      tags:
      - Projects
      operationId: createProject
      x-hb-resource: projects
      security:
      - oauth2:
        - projects.write
      - oauth2:
        - projects.write_own
