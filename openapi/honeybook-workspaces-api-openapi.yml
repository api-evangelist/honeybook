openapi: 3.2.0
info:
  title: HoneyBook Workspaces API
  description: 'The HoneyBook API lets you read and write the data behind a HoneyBook account — contacts, projects, workspaces, smart files, tasks, notes, conversations and more.


    It is a JSON HTTP API. Every request is authenticated with an OAuth 2.0 access token, every response is JSON, and every endpoint lives under a single versioned base path.


    ### Base URL


    ```

    https://api.honeybook.com/api/v3

    ```


    The version is part of the path. A new major version gets its own path and its own documentation; endpoints in `v3` are not removed or changed in place.


    ### Making a request


    Send the access token as a bearer token:


    ```bash

    curl https://api.honeybook.com/api/v3/contacts \

    -H "Authorization: Bearer "

    ```


    ### How this documentation is organized


    **Guides** describe the conventions that apply across the whole API. Read Errors, Pagination and Filtering & Sorting once and they apply to every endpoint you touch.


    **API Reference** documents every endpoint, grouped by the resource it belongs to.


    ### Conventions worth knowing before you start


    - **Identifiers are opaque strings.** An id is a 24-character hexadecimal string. Treat it as an opaque token: do not parse it, and do not assume any structure or ordering.

    - **Timestamps are ISO 8601** in UTC, for example `2026-08-11T14:30:52Z`. Date-only fields are `YYYY-MM-DD`.

    - **Money is an object**, not a bare number — an amount together with its currency. Never assume a currency.

    - **Unknown query parameters are ignored, not rejected.** A misspelled filter name does not produce an error; it simply does not filter. Check your parameter names against the reference when a list returns more rows than you expected.

    - **Absent is not the same as empty.** A field that was not requested and a field that is genuinely empty are distinguished — see Relation Includes.


    The API is private. To get access, fill in the Request Access form.'
  version: v3
servers:
- url: https://api.honeybook.com/api/v3
  description: Production
security:
- oauth2: []
tags:
- name: Workspaces
  description: Operations about Workspaces
paths:
  /workspaces:
    get:
      summary: List the caller company's workspaces
      description: 'Company-scoped: every workspace owned by the caller''s company. The counts and existence reads (getWorkspaceCounts, hasAnyWorkspace) share this exact population, so getWorkspaceCounts.all == this list''s total_items.'
      parameters:
      - in: query
        name: page
        description: 1-indexed page number
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          default: 1
      - in: query
        name: per_page
        description: Page size (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      - in: query
        name: project_id
        description: event_id =
        required: false
        schema:
          type: string
      - in: query
        name: status
        description: workspace_status =
        required: false
        schema:
          type: string
          enum:
          - lead
          - lead_archived
          - client
          - client_archived
          - lead_sent
      - in: query
        name: kind
        description: workspace_type =
        required: false
        schema:
          type: string
          enum:
          - general
          - team
          - design
          - all_vendors
          - timeline
      - in: query
        name: archived
        description: is_archived =
        required: false
        schema:
          type: boolean
      - in: query
        name: created_after
        description: created_at >=
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        description: created_at <=
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        description: 'Comma-separated sort keys; ''-'' prefix = descending. Allowed: created_at, updated_at. Default: -created_at.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List the caller company's workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace_Page'
      tags:
      - Workspaces
      operationId: listWorkspaces
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.read
      - oauth2:
        - workspaces.read_own
  /workspaces/counts:
    get:
      summary: Workspace counts for the caller's company (all / active / inactive)
      description: 'Company-scoped over the SAME population as listWorkspaces (every workspace the caller''s company owns), decomposed along the list''s `archived` filter: active = not archived, inactive = archived, all = active + inactive. So all == listWorkspaces total_items and inactive == listWorkspaces?archived=true.'
      responses:
        '200':
          description: Workspace counts for the caller's company (all / active / inactive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_WorkspaceCounts'
      tags:
      - Workspaces
      operationId: getWorkspaceCounts
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.read
  /workspaces/any:
    get:
      summary: Whether the caller's company has any workspace
      description: 'Company-scoped existence over the SAME population as listWorkspaces: true iff the caller''s company owns at least one workspace (equivalently, getWorkspaceCounts.all > 0).'
      responses:
        '200':
          description: Whether the caller's company has any workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_WorkspaceExistence'
      tags:
      - Workspaces
      operationId: hasAnyWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.read
  /workspaces/{id}:
    get:
      summary: Get a workspace by id
      description: Only a workspace member, or a moderator-or-greater of the workspace's company, may read it; anyone else gets a 404. A workspace that existed and was deleted answers 410 (HBWorkspaceDeletedError) rather than 404, so a client can tell "gone" from "never yours" and clean up its own copy.
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: include
        description: 'Comma-separated relations to populate. Allowed: creator, pipeline_stage, automations, action_suggestions, scheduled_sessions. A relation not requested is null. Nested paths (a.b) are not supported.'
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - creator
            - pipeline_stage
            - automations
            - action_suggestions
            - scheduled_sessions
      - in: query
        name: max_action_suggestions
        description: Max action_suggestions per row (1..25, default 3). Ordered by expires_at asc. Requires include=action_suggestions.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 25
      - in: query
        name: max_scheduled_sessions
        description: Max scheduled_sessions per row (1..100, default 25). Ordered by date_time_start asc. Requires include=scheduled_sessions.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Get a workspace by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace'
      tags:
      - Workspaces
      operationId: getWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.read
      - oauth2:
        - workspaces.read_own
    patch:
      summary: Update a workspace (partial; renames the tab)
      description: Only the workspace creator, an admin of the creator's company, or a member in that company may update; anyone else gets a 404.
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkspace'
        required: true
      responses:
        '200':
          description: Update a workspace (partial; renames the tab)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace'
      tags:
      - Workspaces
      operationId: updateWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
    delete:
      summary: Delete a workspace
      description: Archives the workspace and its files/flows to the graveyard and destroys it (and the Project when its last workspace is removed). Only the creator/owner/admin of the owning company may delete, and only when every file/flow is deletable (else 400).
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: Delete a workspace
      tags:
      - Workspaces
      operationId: deleteWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
  /workspaces/{id}/deletable:
    get:
      summary: Whether a workspace can be deleted by the caller
      description: 'Members only — matching deleteWorkspace itself, which is member-gated inside the manager. A non-member gets a 404 even if they are an admin. A false answer carries a `reason`: not_permitted (a client, a caller from another company, or a team member who is neither the creator nor an owner/admin) or has_undeletable_files (payments or a signed contract).'
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Whether a workspace can be deleted by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_WorkspaceDeletable'
      tags:
      - Workspaces
      operationId: getWorkspaceDeletable
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.read
      - oauth2:
        - workspaces.read_own
  /workspaces/{id}/members:
    get:
      summary: List a workspace's members
      description: Only a workspace member, or a moderator-or-greater of the workspace's company, may read the member list; anyone else gets a 404.
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: page
        description: 1-indexed page number
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          default: 1
      - in: query
        name: per_page
        description: Page size (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: include
        description: 'Comma-separated relations to populate. Allowed: user, contact. A relation not requested is null. Nested paths (a.b) are not supported.'
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - user
            - contact
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: List a workspace's members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_WorkspaceMember_Page'
      tags:
      - Workspaces
      operationId: listWorkspaceMembers
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.read
      - oauth2:
        - workspaces.read_own
  /workspaces/{id}/members/{user_id}:
    put:
      summary: Add a member to a workspace (idempotent)
      description: The caller must both participate in the workspace AND belong to the company that owns it; anyone else gets a 404. Returns the added membership row, the same shape listWorkspaceMembers returns, so a caller can read the contact it just gained without a second round trip.
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: User id to add — a team member of the caller's company, or anyone it holds a contact for and can see (a client, or a collaborator from another company)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addWorkspaceMember'
        required: true
      responses:
        '200':
          description: Add a member to a workspace (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_WorkspaceMember'
      tags:
      - Workspaces
      operationId: addWorkspaceMember
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
    delete:
      summary: Remove a member from a workspace
      description: Only the workspace creator or a super-admin of the creator's company may remove a member; anyone else gets a 404. Neither the creator nor the caller themselves can be removed (400).
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: Member user id to remove
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: Remove a member from a workspace
      tags:
      - Workspaces
      operationId: removeWorkspaceMember
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
  /workspaces/{id}/tags/{tag_id}:
    put:
      summary: Tag a workspace (idempotent)
      description: Members and super-admins of the creator's company only; anyone else gets a 404.
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: path
        name: tag_id
        description: Tag id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Tag a workspace (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace'
      tags:
      - Workspaces
      operationId: addWorkspaceTag
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
    delete:
      summary: Untag a workspace (idempotent)
      description: Members and super-admins of the creator's company only; anyone else gets a 404.
      parameters:
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: path
        name: tag_id
        description: Tag id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: Untag a workspace (idempotent)
      tags:
      - Workspaces
      operationId: removeWorkspaceTag
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
  /workspaces/{id}/archive:
    post:
      summary: Archive a workspace for the caller and their team
      description: Only a workspace member, or a super-admin of the creator's company, may archive; anyone else gets a 404.
      parameters:
      - in: header
        name: Idempotency-Key
        description: 'Optional, 1-255 printable ASCII. Retrying with the same key, path and body within 24h returns the first response verbatim (`Idempotent-Replayed: true`) instead of creating another.'
        required: false
        schema:
          type: string
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/archiveWorkspace'
        required: true
      responses:
        '200':
          description: Archive a workspace for the caller and their team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace'
      tags:
      - Workspaces
      operationId: archiveWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
  /workspaces/{id}/unarchive:
    post:
      summary: Unarchive a workspace for the caller
      description: Only a workspace member, or a super-admin of the creator's company, may unarchive; anyone else gets a 404.
      parameters:
      - in: header
        name: Idempotency-Key
        description: 'Optional, 1-255 printable ASCII. Retrying with the same key, path and body within 24h returns the first response verbatim (`Idempotent-Replayed: true`) instead of creating another.'
        required: false
        schema:
          type: string
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Unarchive a workspace for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace'
      tags:
      - Workspaces
      operationId: unarchiveWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
  /workspaces/{id}/book:
    post:
      summary: Book a workspace (mark the project as booked)
      description: Sets status to `client` and advances the pipeline stage to the company's paid stage (else signed, else the first projects-group stage), only when that is forward of the current one. A no-op on an already-booked workspace. Only the workspace creator, an admin of the creator's company, or a member in that company may book; anyone else gets a 404. 403 when the caller's `mark_project_as_booked` gate is off; 422 when the workspace has no project, is archived, or the company resolves no target stage.
      parameters:
      - in: header
        name: Idempotency-Key
        description: 'Optional, 1-255 printable ASCII. Retrying with the same key, path and body within 24h returns the first response verbatim (`Idempotent-Replayed: true`) instead of creating another.'
        required: false
        schema:
          type: string
      - in: path
        name: id
        description: Workspace id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bookWorkspace'
        required: true
      responses:
        '200':
          description: Book a workspace (mark the project as booked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_Workspace'
      tags:
      - Workspaces
      operationId: bookWorkspace
      x-hb-resource: workspaces
      security:
      - oauth2:
        - workspaces.write
      - oauth2:
        - workspaces.write_own
  /projects/{id}/workspaces:
    post:
      description: Create a workspace on a project
      parameters:
      - in: header
        name: Idempotency-Key
        description: 'Optional, 1-255 printable ASCII. Retrying with the same key, path and body within 24h returns the first response verbatim (`Idempotent-Replayed: true`) instead of creating another.'
        required: false
        schema:
          type: string
      - in: path
        name: id
        description: Project id
        required: true
        schema:
          type: string
      - in: query
        name: partner_only
        description: '`true` restricts the request to records your integration created: lists and reads return only those, and updates and deletes reach only those (anything else is a 404). Omit or `false` reaches everything the granted scope allows, and requires the full scope. Creates accept `true` and always record your integration as the creator.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createProjectWorkspace'
        required: true
      responses:
        '201':
          description: Create a workspace on a project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Api_V3_Entities_ProjectWorkspace'
      tags:
      - Workspaces
      operationId: createProjectWorkspace
      x-hb-resource: projects
      security:
      - oauth2:
        - projects.write
      - oauth2:
        - projects.write_own
      summary: Create project workspace
      x-summary-source: derived
components:
  schemas:
    Api_V3_Entities_WorkspaceScheduledSession_Projection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Api_V3_Entities_WorkspaceScheduledSession'
          description: The projected rows, capped by the caller's max_*
        total_items:
          type: integer
          format: int32
          description: True total for this parent. total_items > data.length means the cap was hit
      required:
      - data
      - total_items
    addWorkspaceMember:
      type: object
      properties:
        include:
          type: array
          description: 'Comma-separated relations to populate. Allowed: user, contact. A relation not requested is null. Nested paths (a.b) are not supported.'
          items:
            type: string
            enum:
            - user
            - contact
      description: Add a member to a workspace (idempotent)
    Api_V3_Entities_ActionSuggestion:
      type: object
      properties:
        id:
          type: string
          description: Suggestion id (BSON ObjectId hex)
        suggestion_type:
          type:
          - string
          - 'null'
          description: 'Suggestion kind. One of: followup_unconverted_lead'
        status:
          type:
          - string
          - 'null'
          description: Lifecycle status (pending, live, accepted, rejected, stale). Always "live" today — only live, unexpired suggestions are loaded.
        reason:
          type:
          - string
          - 'null'
          description: Why the follow-up is suggested (long form)
        short_reason:
          type:
          - string
          - 'null'
          description: Why the follow-up is suggested (one line, for a badge or banner)
        expires_at:
