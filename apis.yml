    quote, contract, and invoice into one client-facing document, tracked as
    part of the "Project Booked" milestone in Zapier. Modeled as
    list/create/retrieve operations scoped to a project; no public reference
    is published so this is an honest, unverified model.
- aid: honeybook:honeybook-invoices-payments-api
  name: HoneyBook Invoices & Payments API
  tags:
  - Invoices
  - Payments
  - Billing
  - ACH
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.honeybook.com/pricing
  baseURL: https://api.honeybook.com/v1
  properties:
  - url: https://www.honeybook.com/pricing
    type: Documentation
  - url: https://help.honeybook.com/en/articles/2209205-automate-tasks-with-zapier
    type: Documentation
  - url: openapi/honeybook-openapi.yml
    type: OpenAPI
  description: Not a documented public API. Modeled from HoneyBook's invoicing
    and payments feature and its "Payment Received" Zapier trigger, which
    fires on any successfully paid client payment (card or ACH, manual or
    automatic). Includes list/create/retrieve for invoices and read access to
    payment records. Card payments are processed starting at 2.7% + 10 cents
    and ACH bank transfers at 1.5% per HoneyBook's published pricing page; no
    endpoint reference is public, so paths and schemas here are an honest,
    unverified model.
- aid: honeybook:honeybook-scheduler-api
  name: HoneyBook Scheduler API
  tags:
  - Scheduling
  - Calendar
  - Sessions
  - Booking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.honeybook.com/features/scheduling
  baseURL: https://api.honeybook.com/v1
  properties:
  - url: https://www.honeybook.com/features/scheduling
    type: Documentation
  - url: openapi/honeybook-openapi.yml
    type: OpenAPI
  description: Not a documented public API. HoneyBook Scheduler lets clients
    self-book session types (consultations, shoots, calls) against a
    provider's availability, and is gated to the Essentials and Premium
    membership plans (unlimited sessions; Starter is capped at one live
    session type). Modeled as session-type listing and booking
    create/list/retrieve operations; no public reference exists, so this is
    an honest, unverified model rather than a confirmed API.
- aid: honeybook:honeybook-webhooks-api
  name: HoneyBook Webhooks / Automation Events
  tags:
  - Webhooks
  - Events
  - Automation
  - Zapier
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.honeybook.com/en/articles/2209205-automate-tasks-with-zapier
  baseURL: https://api.honeybook.com/v1
  properties:
  - url: https://help.honeybook.com/en/articles/2209205-automate-tasks-with-zapier
    type: Documentation
  - url: openapi/honeybook-openapi.yml
    type: OpenAPI
  description: Not a documented public webhook API. HoneyBook's event surface
    is only exposed indirectly, as polling-based triggers inside its Zapier
    integration (New Client, New Inquiry, Project Booked, Payment Received,
    Project Stage Changed). No outbound webhook subscription endpoint, signing
    secret, or delivery/retry contract is published for third parties.
    Modeled here as a generic subscribe/list/delete webhook surface mirroring
    those five Zapier trigger events, for completeness only - it is not a
    confirmed or currently reachable HoneyBook API.
