aid: honeybook
url: https://raw.githubusercontent.com/api-evangelist/honeybook/refs/heads/main/apis.yml
name: HoneyBook
kind: company
description: HoneyBook is an all-in-one clientflow management platform for
  independent, service-based businesses - photographers, event planners,
  designers, consultants, coaches, and similar creative entrepreneurs. It
  combines CRM/lead capture, proposals, contracts and e-signature, invoicing
  and payments, scheduling, automations, and client communication in one
  product. HoneyBook does not publish a self-serve public developer API or a
  developer portal; third-party connectivity is offered through a limited set
  of native integrations (QuickBooks Online, Zoom, Calendly, Flodesk, Canva,
  Meta Leads, Slack, Asana, monday.com) and, most broadly, through Zapier. An
  internal API host (api.honeybook.com) is live and clearly powers the Zapier
  integration and native connectors, but HoneyBook has never published a
  self-serve technical reference, OAuth client registration flow, or endpoint
  documentation for outside developers, and community requests for direct API
  access date back to at least January 2024 with no roadmap commitment as of
  this review.
